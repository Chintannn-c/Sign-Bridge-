apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signbridge-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "signbridge-backend-service"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signbridge-frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: signbridge-backend-service
                port:
                  number: 5000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: signbridge-backend-service
                port:
                  number: 5001
