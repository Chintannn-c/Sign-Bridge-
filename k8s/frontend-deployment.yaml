apiVersion: apps/v1
kind: Deployment
metadata:
  name: signbridge-frontend
  labels:
    app: signbridge
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signbridge
      component: frontend
  template:
    metadata:
      labels:
        app: signbridge
        component: frontend
    spec:
      containers:
        - name: frontend
          image: signbridge-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: signbridge-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: signbridge
    component: frontend
  ports:
    - port: 80
      targetPort: 80
