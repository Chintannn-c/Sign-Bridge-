apiVersion: apps/v1
kind: Deployment
metadata:
  name: signbridge-backend
  labels:
    app: signbridge
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signbridge
      component: backend
  template:
    metadata:
      labels:
        app: signbridge
        component: backend
    spec:
      containers:
        - name: backend
          image: signbridge-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
            - name: ws
              containerPort: 5001
          env:
            - name: DB_PATH
              value: /data/signbridge.db
          envFrom:
            - configMapRef:
                name: signbridge-config
            - secretRef:
                name: signbridge-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: sqlite-storage
              mountPath: /data
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: signbridge-sqlite-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signbridge-sqlite-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: signbridge-backend-service
spec:
  type: ClusterIP
  selector:
    app: signbridge
    component: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
    - name: ws
      port: 5001
      targetPort: 5001
