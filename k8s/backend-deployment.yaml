apiVersion: apps/v1
kind: Deployment
metadata:
  name: signbridge-backend
  labels:
    app: signbridge
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signbridge
      component: backend
  template:
    metadata:
      labels:
        app: signbridge
        component: backend
    spec:
      containers:
        - name: backend
          image: signbridge-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: signbridge-config
            - secretRef:
                name: signbridge-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/backend/database
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: signbridge-sqlite-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signbridge-sqlite-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: signbridge-backend-service
spec:
  type: ClusterIP
  selector:
    app: signbridge
    component: backend
  ports:
    - port: 5000
      targetPort: 5000
